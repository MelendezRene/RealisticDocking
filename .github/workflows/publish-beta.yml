name: Publish RealisticDocking Beta

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Download KSP 1.12.5 references
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/KSPModdingLibs/KSPLibs/raw/main/KSP-1.12.5.zip" -OutFile "$env:RUNNER_TEMP\ksp.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ksp.zip" -DestinationPath "$env:RUNNER_TEMP\ksp" -Force
      - name: Build plugin
        shell: powershell
        run: |
          $managed = Join-Path $env:RUNNER_TEMP "ksp\KSP_x64_Data\Managed"
          if (!(Test-Path (Join-Path $managed "Assembly-CSharp.dll"))) { throw "KSP references were not extracted correctly" }
          msbuild "Source\RealisticDocking\RealisticDocking.csproj" /t:Rebuild /p:Configuration=Release "/p:KSPManaged=$managed"
      - name: Verify DLL
        shell: powershell
        run: |
          if (!(Test-Path "GameData/RealisticDocking/Plugins/RealisticDocking.dll")) { throw "RealisticDocking.dll was not produced" }
          Get-Item "GameData/RealisticDocking/Plugins/RealisticDocking.dll"
      - name: Package installable ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path GameData/RealisticDocking -DestinationPath release/RealisticDocking-v0.2.1-beta.zip -Force
      - name: Publish GitHub prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.1-beta *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.2.1-beta release/RealisticDocking-v0.2.1-beta.zip --clobber
          } else {
            gh release create v0.2.1-beta release/RealisticDocking-v0.2.1-beta.zip --title "RealisticDocking Beta v0.2.1" --target main --prerelease --notes "Beta 0.2.1. Extended NDS/IDA passive target tracking while keeping short-range physical alignment/capture. Includes active/passive docking roles, automatic compatible passive-port detection, alignment assist, capture telemetry, RO/Benjee profiles, and Principia-friendly force/torque based control."
          }
