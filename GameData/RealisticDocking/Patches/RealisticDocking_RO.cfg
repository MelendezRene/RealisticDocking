// RealisticDocking beta 0.1
// Applies to every part that already has ModuleDockingNode.
@PART[*]:HAS[@MODULE[ModuleDockingNode],!MODULE[RealisticDockingPort]]:FINAL
{
  MODULE
  {
    name = RealisticDockingPort
    softCaptureRange = 0.25
    hardCaptureRange = 0.035
    maxCaptureVelocity = 0.15
    nominalCaptureVelocity = 0.05
    maxAngularError = 8.0
    hardCaptureAngularError = 1.0
    maxLateralOffset = 0.12
    hardCaptureOffset = 0.02
    softAcquireForce = 0.35
    softAcquireTorque = 0.18
    hardAcquireForce = 1.20
    hardAcquireTorque = 0.80
    verboseLogging = false
  }
}
