// RealisticDocking beta 0.2
// Generic support for existing ModuleDockingNode parts.
@PART[*]:HAS[@MODULE[ModuleDockingNode],!MODULE[RealisticDockingPort]]:FINAL
{
  MODULE
  {
    name = RealisticDockingPort
    dockingRole = AUTO
    dockingProfile = GENERIC

    targetDetectionRange = 5.0
    alignmentAssistRange = 2.5
    maxAssistAngularError = 25.0
    positionGain = 0.65
    velocityDamping = 1.10
    attitudeGain = 3.0
    angularDamping = 1.25
    maxAlignmentAcceleration = 0.12
    maxAlignmentTorque = 8.0

    softCaptureRange = 0.25
    hardCaptureRange = 0.035
    maxCaptureVelocity = 0.15
    nominalCaptureVelocity = 0.05
    maxAngularError = 8.0
    hardCaptureAngularError = 1.0
    maxLateralOffset = 0.12
    hardCaptureOffset = 0.02
    softAcquireForce = 0.35
    softAcquireTorque = 0.18
    hardAcquireForce = 1.20
    hardAcquireTorque = 0.80
    verboseLogging = false
  }
}

// -----------------------------------------------------------------------------
// Benjee10 SharedAssets - NDS / IDA / APAS
// Current SharedAssets use nodeType B10_APAS for these ports.
// -----------------------------------------------------------------------------

@PART[B10_NDS]:HAS[@MODULE[RealisticDockingPort]]:FINAL
{
  @MODULE[RealisticDockingPort]
  {
    @dockingRole = ACTIVE
    @dockingProfile = BENJEE_NDS_ACTIVE
    @targetDetectionRange = 6.0
    @alignmentAssistRange = 3.0
    @maxAssistAngularError = 20.0
    @maxAlignmentAcceleration = 0.10
    @maxAlignmentTorque = 7.0
    @softCaptureRange = 0.30
    @hardCaptureRange = 0.040
    @maxCaptureVelocity = 0.12
    @nominalCaptureVelocity = 0.04
    @maxAngularError = 7.0
    @hardCaptureAngularError = 0.8
    @maxLateralOffset = 0.10
    @hardCaptureOffset = 0.015
  }
}

@PART[B10_NDS_passive|B10_IDA]:HAS[@MODULE[RealisticDockingPort]]:FINAL
{
  @MODULE[RealisticDockingPort]
  {
    @dockingRole = PASSIVE
    @dockingProfile = BENJEE_NDS_PASSIVE
    @targetDetectionRange = 6.0
    @alignmentAssistRange = 0.0
  }
}

@PART[B10_APASv2]:HAS[@MODULE[RealisticDockingPort]]:FINAL
{
  @MODULE[RealisticDockingPort]
  {
    @dockingRole = ACTIVE
    @dockingProfile = BENJEE_APAS_ACTIVE
    @targetDetectionRange = 6.0
    @alignmentAssistRange = 2.5
    @maxAssistAngularError = 18.0
  }
}

// -----------------------------------------------------------------------------
// Benjee10 SharedAssets - Common Berthing Mechanism.
// Active CBMs may align to the passive CBM; passive never drives alignment.
// -----------------------------------------------------------------------------

@PART[ht2_CBM]:HAS[@MODULE[RealisticDockingPort]]:FINAL
{
  @MODULE[RealisticDockingPort]
  {
    @dockingRole = PASSIVE
    @dockingProfile = BENJEE_CBM_PASSIVE
    @targetDetectionRange = 4.0
    @alignmentAssistRange = 0.0
  }
}

@PART[ht2_CBM_active1|ht2_CBM_active2]:HAS[@MODULE[RealisticDockingPort]]:FINAL
{
  @MODULE[RealisticDockingPort]
  {
    @dockingRole = ACTIVE
    @dockingProfile = BENJEE_CBM_ACTIVE
    @targetDetectionRange = 4.0
    @alignmentAssistRange = 1.8
    @maxAssistAngularError = 12.0
    @maxAlignmentAcceleration = 0.06
    @maxAlignmentTorque = 10.0
    @softCaptureRange = 0.18
    @hardCaptureRange = 0.025
    @maxCaptureVelocity = 0.06
    @nominalCaptureVelocity = 0.02
    @maxAngularError = 4.0
    @hardCaptureAngularError = 0.5
    @maxLateralOffset = 0.06
    @hardCaptureOffset = 0.010
  }
}

// -----------------------------------------------------------------------------
// Benjee10 hybrid SSVP/APAS ports.
// Male drives alignment; female/drogue is passive.
// -----------------------------------------------------------------------------

@PART[B10_hybrid_male]:HAS[@MODULE[RealisticDockingPort]]:FINAL
{
  @MODULE[RealisticDockingPort]
  {
    @dockingRole = ACTIVE
    @dockingProfile = BENJEE_SSVP_MALE
    @targetDetectionRange = 5.0
    @alignmentAssistRange = 2.0
    @maxAssistAngularError = 20.0
  }
}

@PART[B10_hybrid_female]:HAS[@MODULE[RealisticDockingPort]]:FINAL
{
  @MODULE[RealisticDockingPort]
  {
    @dockingRole = PASSIVE
    @dockingProfile = BENJEE_SSVP_FEMALE
    @targetDetectionRange = 5.0
    @alignmentAssistRange = 0.0
  }
}
